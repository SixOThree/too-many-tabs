<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Too Many Tabs</title>
<meta name="description" content="A sitcom intro that won't stop restarting, about browser tabs that open faster than you can close them.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 29V9a4 4 0 0 1 4-4h18a4 4 0 0 1 4 4v20z' fill='%230a28b8'/%3E%3Cpath d='M11 12l10 10M21 12L11 22' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --vcr-blue: #0a28b8;
    --osd-white: #f4f6ff;
    --fringe-red: #ff2a4a;
    --fringe-cyan: #20e0ff;
    --osd-font: "Consolas", "Menlo", "DejaVu Sans Mono", "Lucida Console", monospace;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .stage {
    position: fixed;
    inset: 0;
    background: #000;
  }

  .stage.idle { cursor: none; }

  video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* Stopped or paused: VCR blue rises from the bottom over the frame, and the whole screen is the play button. */
  .play {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: end center;
    margin: 0;
    padding: 0 1rem calc(7vh + env(safe-area-inset-bottom, 0px));
    border: 0;
    color: var(--osd-white);
    cursor: pointer;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.14) 0 2px, transparent 2px 4px),
      linear-gradient(to bottom, rgba(10, 40, 184, 0.1) 40%, rgba(10, 40, 184, 0.92));
    -webkit-tap-highlight-color: transparent;
  }

  .play:focus { outline: none; }

  .osd {
    font: 700 clamp(2.5rem, 8vw, 6.5rem) / 1 var(--osd-font);
    letter-spacing: 0.02em;
    padding: 0.18em 0.32em;
    text-shadow: -0.03em 0 var(--fringe-red), 0.03em 0 var(--fringe-cyan);
    transition: text-shadow 120ms ease-out;
  }

  .play:hover .osd,
  .play:focus-visible .osd {
    text-shadow: -0.07em 0 var(--fringe-red), 0.07em 0 var(--fringe-cyan);
  }

  .play:focus-visible .osd {
    outline: 0.04em solid var(--osd-white);
    outline-offset: 0.08em;
  }

  .message {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 1.5rem;
    text-align: center;
    color: var(--osd-white);
    background: var(--vcr-blue);
    font: 700 clamp(1.1rem, 3.2vw, 2rem) / 1.4 var(--osd-font);
  }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .osd { transition: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <video id="video" src="too_many_tabs.mp4" poster="poster.jpg" preload="metadata" playsinline></video>
  <button class="play" id="play" type="button" aria-label="Play Too Many Tabs">
    <span class="osd" aria-hidden="true">PLAY ▶</span>
  </button>
  <p class="message" id="message" role="alert" hidden>The video didn't load. Reload the page to try again.</p>
</main>
<script>
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const play = document.getElementById('play');
  const message = document.getElementById('message');

  let failed = false;

  function render() {
    play.hidden = failed || !(video.paused || video.ended);
  }

  function start() {
    if (video.ended) video.currentTime = 0;
    video.play().catch(render);
  }

  function toggle() {
    if (video.paused || video.ended) start();
    else video.pause();
  }

  const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;

  function toggleFullscreen() {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    const request = stage.requestFullscreen || stage.webkitRequestFullscreen;
    const call = fullscreenElement() ? () => exit.call(document) : () => request.call(stage);
    try {
      Promise.resolve(call()).catch(() => {});
    } catch (err) {
      // Fullscreen isn't available; the video still fills the window.
    }
  }

  video.addEventListener('play', () => { render(); wake(); });
  video.addEventListener('pause', () => { render(); wake(); });
  video.addEventListener('ended', render);
  video.addEventListener('error', () => {
    console.error('Could not load', video.currentSrc || video.src, video.error);
    failed = true;
    render();
    message.hidden = false;
  });

  play.addEventListener('click', start);
  video.addEventListener('click', () => video.pause());

  // Hide the cursor while the video plays and the mouse is still.
  let idleTimer = 0;
  function wake() {
    stage.classList.remove('idle');
    clearTimeout(idleTimer);
    if (!video.paused) idleTimer = setTimeout(() => stage.classList.add('idle'), 2500);
  }
  stage.addEventListener('pointermove', wake);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // Space and Enter on the focused play button are already a click.
    if (e.target === play && (e.key === ' ' || e.key === 'Enter')) return;
    switch (e.key) {
      case ' ':
      case 'k':
        e.preventDefault();
        toggle();
        break;
      case 'f':
        toggleFullscreen();
        break;
      case 'ArrowLeft':
        video.currentTime = Math.max(0, video.currentTime - 5);
        break;
      case 'ArrowRight':
        if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 5);
        break;
    }
  });
</script>
</body>
</html>
